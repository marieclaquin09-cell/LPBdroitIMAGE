name: Supabase Heartbeat

on:
  schedule:
    # Toutes les 72h (à 8h00 UTC) — marge confortable avant les 7 jours de pause
    - cron: '0 8 */3 * *'
  workflow_dispatch:   # permet de le lancer à la main depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            "https://mfczutghueypranjeixx.supabase.co/rest/v1/residents?select=id&limit=1" \
            -H "apikey: sb_publishable_aYGmG0tKFPCI2UPkWakEvw_qn5u-8Ww"
