name: Supabase Heartbeat

on:
  schedule:
    # Deux fois par jour (08h00 et 20h00 UTC) — activité clairement suffisante
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:   # lancement manuel possible depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "Ping du $(date -u)"
          for endpoint in "residents?select=id&limit=1" "recueils?select=id&limit=1"; do
            curl -sf -o /dev/null -w "  $endpoint -> HTTP %{http_code}\n" \
              "https://mfczutghueypranjeixx.supabase.co/rest/v1/$endpoint" \
              -H "apikey: sb_publishable_aYGmG0tKFPCI2UPkWakEvw_qn5u-8Ww"
          done
